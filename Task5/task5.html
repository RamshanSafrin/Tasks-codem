<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Immediately Invoked Function Expression (IIFE)</title>
</head>
<body>
    <script>
        (function(){
            let num=10;
            let additionResult=num+10;
            console.log("Result of Addition is: "+additionResult);
        })();
    </script>

</body>
</html>
