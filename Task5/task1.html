<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Funstions Operations</title>
</head>
<body>
    <script>
        function calculateSum(a,b){
            return a+b;

        }
        function calculateProduct(x,y){
            return x*y;
        }
        let sumResult=calculateSum(10,5);
        let productResult=calculateProduct(5,2);
        console.log("Sum:"+sumResult);
        console.log("Product:"+productResult)
    </script>
</body>
</html>
