<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Function Validation Utility</title>
</head>

<body>
    <h2>Registration Form</h2>
    <form onsubmit="return mainValidation()">
        Name: <input type="text" id="name"><br><br>
        Email: <input type="text" id="email"><br><br>
        Password: <input type="password" id="password"><br><br>
        <button type="submit">Submit</button>
    </form>
    <script>
        function checkEmpty(value) {
            return value==="";
        }
        function validateEmail(email) {
            return email.includes("@") && email.includes(".");
        }
        function validatePassword(password) {
            return password.length >= 8;
        }
        function mainValidation() {
            let name =document.getElementById("name").value;
            let email =document.getElementById("email").value;
            let password =document.getElementById("password").value;
            if (checkEmpty(name)||checkEmpty(email)||checkEmpty(password)) {
                console.log("Error: Fields cannot be empty");
                return false;
            }
            if (!validateEmail(email)) {
                console.log("Error:Invalid Email Format");
                return false;
            }
            if (!validatePassword(password)) {
                console.log("Error: Password must be at least 8 characters");
                return false;
            }
            console.log("Form validation successful");
            return true;
        }
    </script>
</body>

</html>
