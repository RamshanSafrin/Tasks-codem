<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Expressions and Arrow Functions</title>
</head>
<body>
    <script>
        const strLength=function(str){
            return str.length;
        }
        const squareNum=(num)=>{
            return num*num;
        }
        let strLengthResult=strLength("hello");
        let squareNumResult=squareNum(4);
        console.log("Length of the string is:"+strLengthResult);
        console.log("Square  of the number is:"+squareNumResult);
    </script>
</body>
</html>
